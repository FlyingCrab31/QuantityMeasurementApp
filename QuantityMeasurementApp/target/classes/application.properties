# Application environment: dev, test, prod
app.env=dev

# Repository selection: cache | database
repository.type=database

# Connection pool settings
# Defaults used if env-specific values not provided
# db.pool.maxSize defines max open connections
# db.pool.minIdle defines initial idle connections
# db.pool.connectionTimeoutMs defines wait time for a connection

db.pool.maxSize=8
db.pool.minIdle=2
db.pool.connectionTimeoutMs=3000

# Default schema location
# Can be overridden by env-specific property: <env>.db.schema.path

db.schema.path=db/schema.sql

# Development database (H2 file-based)
dev.db.url=jdbc:h2:file:./data/quantity_dev;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=false
dev.db.user=sa
dev.db.password=
dev.db.schema.path=db/schema.sql

# Test database (H2 in-memory)
test.db.url=jdbc:h2:mem:quantity_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=false
test.db.user=sa
test.db.password=
test.db.schema.path=db/schema.sql

# Production database (H2 file-based for now)
prod.db.url=jdbc:h2:file:./data/quantity_prod;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=false
prod.db.user=sa
prod.db.password=
prod.db.schema.path=db/schema.sql

# Logging
logging.level=INFO
